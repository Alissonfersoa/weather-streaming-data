services:
  broker:
    image: apache/kafka:4.3.1
    hostname: broker
    container_name: weather-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093

      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    networks:
      - weather-net
  producer:
    build:
      context: .
      dockerfile: Dockerfile.producer

    container_name: weather-producer

    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:19092
      KAFKA_TOPIC_WEATHER_RAW: weather.raw
      POLL_INTERVAL_SECONDS: 60

    depends_on:
      - broker

    restart: unless-stopped

    networks:
      - weather-net
  spark-bronze:
    image: apache/spark:4.1.3

    container_name: weather-spark-bronze

    user: "0"

    command:
      [
        "/opt/spark/bin/spark-submit",
        "--packages",
        "org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3",
        "/opt/spark/work-dir/spark/bronze_stream.py"
      ]

    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./data:/data

    depends_on:
      - broker

    networks:
      - weather-net

    restart: unless-stopped
  spark-silver:
    image: apache/spark:4.1.3

    container_name: weather-spark-silver

    user: "0"

    command:
      [
        "/opt/spark/bin/spark-submit",
        "/opt/spark/work-dir/spark/silver_stream.py"
      ]

    volumes:
      - ./spark:/opt/spark/work-dir/spark
      - ./data:/data

    depends_on:
      - spark-bronze

    networks:
      - weather-net

    restart: unless-stopped
  analytics-db:
    image: postgres:16

    container_name: weather-analytics-db

    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: weather
      POSTGRES_PASSWORD: weather

    ports:
      - "5433:5432"

    volumes:
      - analytics-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql

    networks:
      - weather-net
  airflow:
    build:
      context: .
      dockerfile: ./docker/airflow/Dockerfile

    container_name: weather-airflow

    command: standalone

    environment:
      ANALYTICS_DB_DSN: postgresql://weather:weather@analytics-db:5432/weather

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./data:/data
      - airflow-home:/opt/airflow

    depends_on:
      - analytics-db

    networks:
      - weather-net
  metabase:
    image: metabase/metabase:latest
    container_name: weather-metabase

    ports:
      - "3000:3000"

    depends_on:
      - analytics-db

    networks:
      - weather-net

networks:
  weather-net:
    name: weather-net

volumes:
  analytics-postgres-data:
  airflow-home:
